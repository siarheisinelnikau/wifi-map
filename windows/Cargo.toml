[package]
name = "wifi-map"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "An honest, local Wi-Fi floor-plan survey workspace for Windows"
repository = "https://github.com/siarheisinelnikau/wifi-map"
build = "build.rs"

[[bin]]
name = "WifiMap"
path = "src/main.rs"

[features]
network-tests = []

[dependencies]
base64 = "=0.22.1"
bytemuck = "1.24"
egui = "=0.33.3"
egui-winit = { version = "=0.33.3", default-features = false, features = ["clipboard", "accesskit"] }
egui_software_backend = { version = "=0.0.2", default-features = false, features = ["std"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
rfd = "=0.15.4"
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
softbuffer = { version = "=0.4.8", default-features = false }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
winresource = "=0.1.34"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 2
strip = "debuginfo"
