name: Android build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: python tools/prepare_assets.py
      - run: bash gradlew --max-workers=2 :domain:test :app:assembleDebug :app:lintDebug
      - run: python tools/verify_apk.py app/build/outputs/apk/debug/app-debug.apk --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: WifiMap-android-preview
          path: android/app/build/outputs/apk/debug/*.apk
